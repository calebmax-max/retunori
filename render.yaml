services:
  - type: web
    name: retunori-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: retunori-media
      mountPath: /opt/render/project/src/backend/media
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTOMATIC_BACKUPS_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: 3.12.7
